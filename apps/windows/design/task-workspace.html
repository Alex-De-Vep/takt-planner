 <header class="tw-titlebar"><i data-lucide="square-check-big" aria-hidden="true"></i><strong>Takt</strong><span class="tw-window-actions" aria-hidden="true">─ □ ×</span></header>
 <div class="tw-grid">
  <nav class="tw-sidebar" aria-label="Task sections">
   <div id="tw-sections"></div><div class="tw-nav-heading">My folders</div><div id="tw-folders"></div>
   <button type="button" class="tw-folder-add" id="tw-new-folder"><i data-lucide="folder-plus" aria-hidden="true"></i>New folder</button>
   <div class="tw-sidebar-footer"><i data-lucide="circle-user-round" aria-hidden="true"></i><span>Local library</span></div>
  </nav>
  <section class="tw-listpane" aria-label="Tasks">
   <div><h2 id="tw-section-title">Inbox</h2><p class="tw-small" id="tw-count"></p></div>
   <div class="tw-search"><input id="tw-search" type="search" placeholder="Search tasks" aria-label="Search tasks"></div>
   <div id="tw-active" class="tw-taskrows"></div>
   <details class="tw-completed" id="tw-completed"><summary id="tw-completed-count">Completed</summary><div id="tw-done"></div></details>
   <button type="button" class="tw-add-task" id="tw-add"><i data-lucide="plus" aria-hidden="true"></i>Add a task</button>
  </section>
  <section class="tw-detail" aria-label="Task editor">
   <div class="tw-toolbar">
    <button type="button" class="tw-icon tw-back" id="tw-back" aria-label="Back to tasks"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
    <button type="button" class="tw-icon" id="tw-toolbar-new" aria-label="New task" data-tooltip="New task"><i data-lucide="square-pen" aria-hidden="true"></i></button>
    <button type="button" class="tw-icon" id="tw-add-subtask" aria-label="Add subtask" data-tooltip="Add subtask"><i data-lucide="list-checks" aria-hidden="true"></i></button>
    <button type="button" class="tw-icon" id="tw-deadline-toggle" aria-label="Task deadline" data-tooltip="Task deadline" aria-expanded="false"><i data-lucide="clock" aria-hidden="true"></i></button>
    <button type="button" class="tw-icon tw-trash" id="tw-delete" aria-label="Delete task" data-tooltip="Delete task"><i data-lucide="trash-2" aria-hidden="true"></i></button>
   </div>
   <div class="tw-flyout" id="tw-deadline" hidden><strong>Task deadline</strong><label class="tw-label"><span>Date</span><input id="tw-date" type="date"></label><label class="tw-checkitem"><input id="tw-include-time" type="checkbox"><span>Include time</span></label><input id="tw-time" type="time" aria-label="Deadline time" hidden><div class="tw-editor-footer"><button type="button" id="tw-clear-date">Clear</button><button type="button" id="tw-apply-date" class="tw-primary">Apply</button></div></div>
   <div class="tw-flyout" id="tw-delete-confirm" hidden><strong>Delete task?</strong><p>The task and its subtasks will be removed.</p><div class="tw-editor-footer"><button type="button" id="tw-delete-cancel">Cancel</button><button type="button" id="tw-delete-yes">Delete</button></div></div>
   <div id="tw-fields" class="tw-fields">
    <div class="tw-location-row"><label class="tw-label"><span>Folder</span><select id="tw-location" aria-label="Folder"></select></label><button class="tw-icon" id="tw-editor-star" type="button" aria-label="Add to Today" aria-pressed="false"><i data-lucide="star" aria-hidden="true"></i></button></div>
    <p class="tw-small" id="tw-created">Created 26 November 2026</p>
    <label class="tw-label"><span>Task</span><textarea class="tw-editor-title" id="tw-title" rows="2"></textarea></label>
    <label class="tw-label"><span>Description</span><textarea class="tw-description" id="tw-description" rows="5"></textarea></label>
    <p class="tw-small" id="tw-deadline-label"></p>
    <div><p>Subtasks</p><div class="tw-checklist" id="tw-checklist" style="margin-top:12px"></div></div>
    <div class="tw-newitem"><input id="tw-new-item" placeholder="Add a subtask" aria-label="New subtask"><button type="button" id="tw-create-item" aria-label="Add subtask"><i data-lucide="plus" aria-hidden="true"></i></button></div>
    <div class="tw-editor-footer"><button type="button" class="tw-primary" id="tw-save">Save changes</button><button type="button" id="tw-complete">Complete task</button></div>
   </div>
   <p id="tw-editor-empty" class="tw-empty" hidden>Select a task to see its details</p>
  </section>
 </div>
 <footer class="tw-status" aria-live="polite"><i data-lucide="hard-drive" aria-hidden="true"></i><span id="tw-status">Local preview · sample tasks</span></footer>
 <script>
 (()=>{
 const root=document.getElementById('takt-windows-tasks');const q=id=>root.querySelector('#'+id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const defaults={section:'inbox',selected:'release',tasks:[
 {id:'release',title:'Prepare the Windows release',description:'Keep the familiar Takt layout.\nUse native Windows controls throughout.\n\n- Review the task workflow\n- Check offline synchronization',folder:'inbox',star:true,done:false,date:'2026-11-27',time:'16:00',items:[{title:'Review the task editor',done:true},{title:'Check synchronization on two devices',done:false},{title:'Prepare release screenshots',done:false}]},
 {id:'notes',title:'Plan the notes migration',description:'Shared rich text and attachments come after task management.',folder:'inbox',star:false,done:false,date:'',time:'',items:[]},
 {id:'feedback',title:'Collect feedback on the first version',description:'Write down what feels natural on Windows.',folder:'inbox',star:false,done:false,date:'2026-11-30',time:'',items:[]},
 {id:'contract',title:'Review the synchronization contract',description:'',folder:'inbox',star:false,done:true,date:'',time:'',items:[]},
 {id:'roadmap',title:'Update the product roadmap',description:'Tasks, notes, events, then AI chat.',folder:'work',star:true,done:false,date:'',time:'',items:[]}
 ],folders:[{id:'work',name:'Work'},{id:'personal',name:'Personal'}]};
 let state=structuredClone(defaults);const saved=globalThis.openai?.widgetState?.privateContent;if(saved&&Array.isArray(saved.tasks)&&saved.tasks.length<60&&Array.isArray(saved.folders)&&saved.folders.length<20&&typeof saved.section==='string')state=saved;
 const sections=[['inbox','Inbox','inbox'],['today','Today','star'],['week','This Week','calendar-days'],['month','Month','calendar-range'],['all','All Tasks','layers']];
 let search='';const current=()=>state.tasks.find(t=>t.id===state.selected);const folderName=id=>sections.find(s=>s[0]===id)?.[1]||state.folders.find(f=>f.id===id)?.name||'Inbox';
 const matches=t=>(state.section==='all'||(state.section==='today'?t.star:t.folder===state.section))&&(!search||(t.title+' '+t.description).toLowerCase().includes(search));
 const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})};
 function remember(){globalThis.openai?.setWidgetState?.({modelContent:{section:state.section,selectedTask:current()?.title||null},privateContent:state}).catch(()=>{});}
 function status(message='Saved in this preview'){q('tw-status').textContent=message;remember();}
 function dateLabel(t){if(!t.date)return '';const parts=t.date.split('-');return parts[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(parts[1])-1]+(t.time?' · '+t.time:'');}
 function renderRows(){
  q('tw-section-title').textContent=folderName(state.section);const tasks=state.tasks.filter(matches);q('tw-count').textContent='Tasks: '+tasks.length;
  const row=t=>'<div class="tw-taskrow" data-selected="'+(t.id===state.selected)+'"><button type="button" class="tw-open" data-open="'+escape(t.id)+'"><div class="tw-tasktitle">'+escape(t.title||'Untitled task')+'</div><div class="tw-meta">'+escape(folderName(t.folder))+(t.items.length?' · '+t.items.filter(i=>i.done).length+'/'+t.items.length:'')+'</div>'+(t.date?'<span class="tw-due">'+icon('clock')+escape(dateLabel(t))+'</span>':'')+'</button><button type="button" class="tw-icon" data-done="'+escape(t.id)+'" aria-label="'+(t.done?'Reopen':'Complete')+' task" aria-pressed="'+t.done+'">'+icon('circle-check')+'</button><button type="button" class="tw-icon" data-star="'+escape(t.id)+'" aria-label="'+(t.star?'Remove from':'Add to')+' Today" aria-pressed="'+t.star+'">'+icon('star')+'</button></div>';
  q('tw-active').innerHTML=tasks.filter(t=>!t.done).map(row).join('')||(tasks.length?'':'<p class="tw-empty">No tasks here yet</p>');q('tw-done').innerHTML=tasks.filter(t=>t.done).map(row).join('');q('tw-completed-count').textContent='Completed · '+tasks.filter(t=>t.done).length;q('tw-completed').hidden=!tasks.some(t=>t.done);
  q('tw-sections').innerHTML=sections.map(([id,name,ico])=>'<button type="button" class="tw-nav" data-section="'+id+'" '+(id===state.section?'aria-current="page"':'')+'>'+icon(ico)+escape(name)+'<span class="tw-count">'+state.tasks.filter(t=>!t.done&&(id==='all'||(id==='today'?t.star:t.folder===id))).length+'</span></button>').join('');
  q('tw-folders').innerHTML=state.folders.map(f=>'<button type="button" class="tw-nav" data-section="'+escape(f.id)+'" '+(f.id===state.section?'aria-current="page"':'')+'>'+icon('folder')+escape(f.name)+'</button>').join('');icons();
 }
 function renderEditor(){const t=current();q('tw-fields').hidden=!t;q('tw-editor-empty').hidden=!!t;['tw-add-subtask','tw-delete','tw-deadline-toggle'].forEach(id=>q(id).disabled=!t);if(!t)return;
  q('tw-location').innerHTML=[...sections.filter(s=>!['today','all'].includes(s[0])).map(s=>[s[0],s[1]]),...state.folders.map(f=>[f.id,f.name])].map(([id,name])=>'<option value="'+escape(id)+'">'+escape(name)+'</option>').join('');q('tw-location').value=t.folder;
  q('tw-title').value=t.title;q('tw-description').value=t.description;q('tw-editor-star').setAttribute('aria-pressed',String(t.star));q('tw-complete').textContent=t.done?'Reopen task':'Complete task';q('tw-deadline-label').textContent=t.date?'Deadline · '+dateLabel(t):'No deadline';
  q('tw-checklist').innerHTML=t.items.map((i,n)=>'<label class="tw-checkitem"><input type="checkbox" data-item="'+n+'" '+(i.done?'checked':'')+'><span>'+escape(i.title)+'</span></label>').join('');icons();
 }
 function saveEditor(){const t=current();if(!t)return;t.title=q('tw-title').value;t.description=q('tw-description').value;t.folder=q('tw-location').value;}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const {section,open,done,star}=b.dataset;if(section){saveEditor();state.section=section;state.selected=null;root.dataset.mobileEditor='false';q('tw-deadline').hidden=true;renderRows();renderEditor();remember();}else if(open){saveEditor();state.selected=open;root.dataset.mobileEditor='true';q('tw-deadline').hidden=true;q('tw-delete-confirm').hidden=true;renderRows();renderEditor();remember();}else if(done){saveEditor();const t=state.tasks.find(t=>t.id===done);t.done=!t.done;renderRows();renderEditor();status();}else if(star){saveEditor();const t=state.tasks.find(t=>t.id===star);t.star=!t.star;renderRows();renderEditor();status();}});
 q('tw-search').addEventListener('input',()=>{search=q('tw-search').value.trim().toLowerCase();renderRows();});
 function add(){saveEditor();const id='new-'+Date.now();state.tasks.unshift({id,title:'New task',description:'',folder:['today','all'].includes(state.section)?'inbox':state.section,star:state.section==='today',done:false,date:'',time:'',items:[]});state.selected=id;search='';q('tw-search').value='';root.dataset.mobileEditor='true';renderRows();renderEditor();q('tw-title').focus();q('tw-title').select();status();}
 q('tw-add').onclick=add;q('tw-toolbar-new').onclick=add;q('tw-back').onclick=()=>{saveEditor();root.dataset.mobileEditor='false';renderRows();status();};
 q('tw-save').onclick=()=>{saveEditor();renderRows();status();};q('tw-title').onchange=q('tw-description').onchange=q('tw-location').onchange=()=>{saveEditor();renderRows();status();};
 q('tw-editor-star').onclick=()=>{saveEditor();const t=current();if(!t)return;t.star=!t.star;renderRows();renderEditor();status();};q('tw-complete').onclick=()=>{saveEditor();const t=current();if(!t)return;t.done=!t.done;renderRows();renderEditor();status();};
 q('tw-checklist').onchange=e=>{if(e.target.matches('[data-item]')&&current()){current().items[Number(e.target.dataset.item)].done=e.target.checked;renderRows();status();}};
 function addItem(){const t=current(),value=q('tw-new-item').value.trim();if(!t||!value)return;t.items.push({title:value,done:false});q('tw-new-item').value='';renderRows();renderEditor();status();}
 q('tw-create-item').onclick=addItem;q('tw-new-item').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addItem();}};q('tw-add-subtask').onclick=()=>q('tw-new-item').focus();
 q('tw-deadline-toggle').onclick=()=>{const t=current();if(!t)return;q('tw-deadline').hidden=!q('tw-deadline').hidden;q('tw-deadline-toggle').setAttribute('aria-expanded',String(!q('tw-deadline').hidden));q('tw-date').value=t.date;q('tw-time').value=t.time;q('tw-include-time').checked=!!t.time;q('tw-time').hidden=!t.time;};q('tw-include-time').onchange=()=>q('tw-time').hidden=!q('tw-include-time').checked;
 q('tw-apply-date').onclick=()=>{const t=current();if(!t)return;if(!q('tw-date').value){q('tw-date').reportValidity();q('tw-date').focus();return;}t.date=q('tw-date').value;t.time=q('tw-include-time').checked?q('tw-time').value:'';q('tw-deadline').hidden=true;q('tw-deadline-toggle').setAttribute('aria-expanded','false');renderRows();renderEditor();status();};
 q('tw-clear-date').onclick=()=>{const t=current();if(!t)return;t.date='';t.time='';q('tw-deadline').hidden=true;renderRows();renderEditor();status();};
 q('tw-delete').onclick=()=>q('tw-delete-confirm').hidden=false;q('tw-delete-cancel').onclick=()=>q('tw-delete-confirm').hidden=true;q('tw-delete-yes').onclick=()=>{state.tasks=state.tasks.filter(t=>t.id!==state.selected);state.selected=null;q('tw-delete-confirm').hidden=true;root.dataset.mobileEditor='false';renderRows();renderEditor();status();};
 q('tw-new-folder').onclick=()=>{const id='folder-'+Date.now();state.folders.push({id,name:'New folder'});state.section=id;state.selected=null;renderRows();renderEditor();status();};
 renderRows();renderEditor();
 })();
 </script>
