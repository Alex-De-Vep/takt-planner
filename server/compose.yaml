x-app: &app
  image: planner-server:${PLANNER_SERVER_VERSION:-0.1.1}
  build: .
  environment: &environment
    NODE_ENV: production
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-300}
    PUBLIC_REQUESTS_PER_MINUTE: ${PUBLIC_REQUESTS_PER_MINUTE:-300}
    DATABASE_URL: postgres://planner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/planner
    AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
    DATA_DIR: /data
    BACKUP_ROOT: /backup
    SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_SECURE: ${SMTP_SECURE:-true}
    SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
    MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    ALLOWED_REGISTRATION_EMAILS: ${ALLOWED_REGISTRATION_EMAILS:-}
    ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
    ACCOUNT_QUOTA_BYTES: ${ACCOUNT_QUOTA_BYTES:-1073741824}
    MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
  volumes:
    - blobs:/data
    - ../backup-staging:/backup
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ../backup-staging:/backup
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app
    command: [node, dist/main.js, migrate]
    restart: 'no'

  api:
    <<: *app
    ports: ["127.0.0.1:${PLANNER_API_PORT:-3030}:3030"]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3030/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: [node, dist/main.js, worker]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  backup:
    user: '1000:1000'
    image: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
    profiles: [tools]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_CACHE_DIR: /tmp/restic-cache
    tmpfs:
      - /tmp:size=134217728
    volumes:
      - ../backup-staging:/backup
      - type: bind
        source: ${BACKUP_REPOSITORY_PATH:-../backups}
        target: /repository

volumes:
  database:
  blobs:
